<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year End Party - Look Back</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Lớp thương hiệu cố định (nằm dưới ảnh) -->
<div id="brand">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div id="bigtext"></div>
  <div id="head"><img id="logo" alt="Ashley"><div id="title"></div></div>
  <div id="slogan"></div>
</div>

<!-- Lớp ảnh + hiệu ứng chuyển cảnh (WebGL, nền trong suốt) -->
<canvas id="gl"></canvas>

<!-- Đường bay phi thuyền (nằm trên ảnh, luôn hiện) -->
<canvas id="ship"></canvas>

<div id="chapter"></div>
<div id="paused">❚❚</div>

<div id="end">
  <div id="mosaic"></div>
  <div id="endtext"><h1></h1><p></p></div>
</div>

<!-- Bảng thử hiệu ứng (phím T) -->
<div id="lab" class="hidden">
  <h3>Hiệu ứng <small>T: đóng</small></h3>
  <div id="fxlist"></div>
  <label class="slow"><input type="checkbox" id="slow"> Chậm ×3 để xem kỹ</label>
  <div class="row">
    <button id="fxall">Chọn hết</button>
    <button id="fxnone">Bỏ hết</button>
    <button id="fxcopy">Copy config</button>
  </div>
  <small id="fxmsg"></small>
</div>

<div id="start">
  <div class="box">
    <h1 id="t"></h1>
    <p id="s"></p>
    <button id="go">Bắt đầu</button>
    <small id="photoinfo" style="margin-top:1.4em"></small>
    <small>Space: tạm dừng · ← / →: chuyển ảnh · F: toàn màn hình · M: nhạc · R: chiếu lại · T: thử hiệu ứng · I: nhập ảnh</small>
  </div>
</div>

<button id="setupbtn" title="Phím I">⚙ Nhập ảnh</button>

<!-- Bảng nhập ảnh: chỉ dùng TRƯỚC khi chiếu, tự ẩn hẳn khi bấm Bắt đầu -->
<div id="setup" class="hidden">
  <div class="sbox">
    <div class="shead"><h2>Nhập ảnh</h2><button id="sclose" class="ghost">Xong ✕</button></div>
    <div class="sdrop">
      <b>Kéo thả ảnh hoặc cả thư mục vào đây</b>
      <span>hoặc</span>
      <div class="srow"><button id="spick">Chọn ảnh…</button><button id="sdir" class="ghost">Chọn thư mục…</button></div>
      <small>JPG, PNG, WebP. Ảnh được thu nhỏ và xoay đúng chiều ngay trên máy này.</small>
    </div>
    <div class="sbar">
      <span id="scount"></span>
      <label>Thứ tự: <select id="ssort"><option value="name">Theo tên file</option><option value="time">Theo thời gian file</option></select></label>
      <button id="sclear" class="ghost danger">Xóa ảnh đã import</button>
    </div>
    <div id="smsg"></div>
    <div id="sgrid"></div>
  </div>
  <input type="file" id="fileIn" accept="image/*" multiple hidden>
  <input type="file" id="dirIn" webkitdirectory multiple hidden>
</div>

<div id="bar"><i></i></div>

<script src="config.js"></script>
<script src="effects.js"></script>
<script src="photos.js"></script>
<script src="import.js"></script>
<script src="ship.js"></script>
<script src="app.js"></script>
</body>
</html>
